name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: flet build apk --verbose

      - name: List output
        if: always()
        run: ls -lhR build/apk || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flet-apk
          path: build/apk/*.apk
          if-no-files-found: warn
