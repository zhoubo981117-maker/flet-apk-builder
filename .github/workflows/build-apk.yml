name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"
          flet --version

      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
        run: |
          # --yes: 自动同意安装 Flutter SDK / JDK / Android SDK（CI 无 TTY，必须）
          # 不再自行预装 Flutter，避免版本与 flet.version.flutter_version 不匹配
          flet build apk --yes --verbose 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== BUILD FAILED (exit $status) ==="
            tail -n 150 /tmp/build.log
          fi
          exit "$status"

      - name: List output
        if: always()
        run: ls -lhR build 2>/dev/null | head -n 200 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flet-apk
          path: |
            build/apk/**/*.apk
            build/**/*.apk
          if-no-files-found: warn
